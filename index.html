<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>A Little Secret 💙</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      background: #dceeff;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      font-family: Arial, sans-serif;
      overflow-x: hidden;
    }

    .phone-page {
      position: relative;
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      margin: 0 auto;
      overflow: hidden;
      background: #eef8ff;
    }

    /* Main artwork */
    .page-image {
      display: block;
      width: 100%;
      height: auto;
      margin: 0;
      padding: 0;
    }

    /* REAL password input */
    .password-input {
      position: absolute;

      left: 15%;
      top: 52.5%;

      width: 70%;
      height: 7.8%;

      border: none;
      outline: none;
      background: transparent;

      padding: 0 65px;

      font-size: 18px;
      font-family: Arial, sans-serif;
      color: #477cc7;

      z-index: 10;
    }

    .password-input::placeholder {
      color: transparent;
    }

    /* Invisible Unlock button */
    .unlock-button {
      position: absolute;

      left: 26%;
      top: 64.2%;

      width: 48%;
      height: 8.5%;

      border: none;
      background: transparent;

      cursor: pointer;
      padding: 0;

      z-index: 11;
    }

    .unlock-button:active {
      transform: scale(0.96);
    }

    /* Invisible eye button */
    .eye-button {
      position: absolute;

      right: 18%;
      top: 53.2%;

      width: 12%;
      height: 6%;

      border: none;
      background: transparent;

      cursor: pointer;

      z-index: 12;
    }

    /* =========================
       MAGIC EFFECT
       ========================= */

    .magic {
      position: absolute;
      inset: 0;

      pointer-events: none;

      opacity: 0;

      z-index: 50;
    }

    /* Golden glow */
    .glow {
      position: absolute;

      left: 50%;
      top: 31%;

      width: 45%;
      aspect-ratio: 1;

      transform: translate(-50%, -50%) scale(0);

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(255, 250, 200, 0.95) 0%,
          rgba(255, 231, 130, 0.55) 30%,
          rgba(255, 255, 255, 0) 70%
        );

      filter: blur(8px);
    }

    /* Stars */
    .star {
      position: absolute;

      color: white;

      font-size: 20px;

      opacity: 0;

      text-shadow:
        0 0 8px #ffffff,
        0 0 16px #ffe98a;
    }

    .star1 {
      left: 25%;
      top: 28%;
    }

    .star2 {
      left: 68%;
      top: 27%;
    }

    .star3 {
      left: 30%;
      top: 38%;
    }

    .star4 {
      left: 70%;
      top: 39%;
    }

    .star5 {
      left: 50%;
      top: 22%;
    }

    /* Key */
    .key {
      position: absolute;

      left: 50%;
      top: 38%;

      font-size: 55px;

      opacity: 0;

      transform:
        translate(-50%, -50%)
        rotate(-25deg)
        scale(0.5);

      filter:
        drop-shadow(0 0 8px rgba(255, 232, 120, 0.9));

      z-index: 60;
    }

    /* Screen flash */
    .flash {
      position: absolute;

      inset: 0;

      background: white;

      opacity: 0;

      z-index: 70;
    }

    /* =========================
       MAGIC ANIMATION
       ========================= */

    .magic.active {
      opacity: 1;
    }

    .magic.active .glow {
      animation: glowIn 1.2s ease forwards;
    }

    .magic.active .key {
      animation: keyMove 2.4s ease-in-out forwards;
    }

    .magic.active .star {
      animation: starBurst 2.5s ease-out forwards;
    }

    .magic.active .star1 {
      animation-delay: 1.5s;
    }

    .magic.active .star2 {
      animation-delay: 1.7s;
    }

    .magic.active .star3 {
      animation-delay: 1.4s;
    }

    .magic.active .star4 {
      animation-delay: 1.8s;
    }

    .magic.active .star5 {
      animation-delay: 1.6s;
    }

    .magic.active .flash {
      animation: flashScreen 0.7s ease-in 2.8s forwards;
    }

    @keyframes glowIn {

      0% {
        transform:
          translate(-50%, -50%)
          scale(0);
        opacity: 0;
      }

      60% {
        transform:
          translate(-50%, -50%)
          scale(1.4);
        opacity: 1;
      }

      100% {
        transform:
          translate(-50%, -50%)
          scale(1.1);
        opacity: 0.9;
      }
    }

    @keyframes keyMove {

      0% {
        left: 50%;
        top: 38%;
        opacity: 0;
        transform:
          translate(-50%, -50%)
          rotate(-25deg)
          scale(0.5);
      }

      20% {
        opacity: 1;
      }

      65% {
        left: 50%;
        top: 31%;
        transform:
          translate(-50%, -50%)
          rotate(5deg)
          scale(1);
      }

      78% {
        left: 50%;
        top: 31%;
        transform:
          translate(-50%, -50%)
          rotate(95deg)
          scale(1);
      }

      88% {
        left: 50%;
        top: 31%;
        transform:
          translate(-50%, -50%)
          rotate(70deg)
          scale(1.05);
      }

      100% {
        left: 50%;
        top: 31%;
        opacity: 0;
        transform:
          translate(-50%, -50%)
          rotate(70deg)
          scale(0.8);
      }
    }

    @keyframes starBurst {

      0% {
        opacity: 0;
        transform: scale(0.3);
      }

      30% {
        opacity: 1;
        transform: scale(1.2);
      }

      100% {
        opacity: 0;
        transform:
          translate(
            calc((50vw - 50%) * 0.1),
            -45px
          )
          scale(1.8);
      }
    }

    @keyframes flashScreen {

      0% {
        opacity: 0;
      }

      50% {
        opacity: 0.9;
      }

      100% {
        opacity: 0;
      }
    }

    @media (min-width: 600px) {

      body {
        padding: 25px 0;
      }

      .phone-page {
        border-radius: 20px;

        box-shadow:
          0 10px 40px
          rgba(40, 90, 150, 0.25);
      }
    }

    @media (max-width: 599px) {

      body {
        background: #eef8ff;
        padding: 0;
      }

      .phone-page {
        width: 100%;
        max-width: 430px;
        border-radius: 0;
        box-shadow: none;
      }
    }

  </style>
</head>

<body>

  <div class="phone-page">

    <!-- YOUR PASSWORD PAGE IMAGE -->
    <img
      class="page-image"
      src="password-door.png"
      alt="A little secret"
    >

    <!-- REAL PASSWORD BOX -->
    <input
      id="password"
      class="password-input"
      type="password"
      autocomplete="off"
      aria-label="Enter password"
    >

    <!-- SHOW / HIDE PASSWORD -->
    <button
      class="eye-button"
      onclick="togglePassword()"
      aria-label="Show password"
    ></button>

    <!-- UNLOCK -->
    <button
      class="unlock-button"
      onclick="checkPassword()"
      aria-label="Unlock"
    ></button>


    <!-- MAGIC EFFECTS -->
    <div id="magic" class="magic">

      <div class="glow"></div>

      <div class="key">🔑</div>

      <div class="star star1">✦</div>
      <div class="star star2">✧</div>
      <div class="star star3">✦</div>
      <div class="star star4">✧</div>
      <div class="star star5">✦</div>

      <div class="flash"></div>

    </div>

  </div>


  <script>

    function checkPassword() {

      const enteredPassword =
        document.getElementById("password").value;

      /*
        PUT YOUR EXISTING PASSWORD HERE.

        Do NOT send your password to me.
      */

      const correctPassword = "bandri";


      if (enteredPassword === correctPassword) {

        // Hide the controls
        document.getElementById("password").style.display = "none";
        document.querySelector(".unlock-button").style.display = "none";
        document.querySelector(".eye-button").style.display = "none";

        // Start magic
        document
          .getElementById("magic")
          .classList.add("active");

        // Go to Access Granted page
        setTimeout(function() {

          window.location.href = "birthday.html";

        }, 3500);

      } else {

        alert("Hmm... that's not quite it 💙");

      }

    }


    function togglePassword() {

      const password =
        document.getElementById("password");

      if (password.type === "password") {

        password.type = "text";

      } else {

        password.type = "password";

      }

    }


    // Pressing Enter also unlocks

    document
      .getElementById("password")
      .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {

          checkPassword();

        }

      });

  </script>

</body>
</html>
