<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>A Little Secret 💙</title>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }


    body {

      background: #dceeff;

      display: flex;

      justify-content: center;

      align-items: flex-start;

      overflow-x: hidden;

      font-family: Arial, sans-serif;
    }


    /* =================================
       MAIN PAGE
       ================================= */

    .page {

      position: relative;

      width: 100%;

      max-width: 430px;

      /*
        Your image is 1024 x 1536.
        This keeps the exact same shape.
      */

      aspect-ratio: 2 / 3;

      margin: 0 auto;

      overflow: hidden;

      background: #eef8ff;
    }


    /* =================================
       YOUR ORIGINAL IMAGE
       ================================= */

    .page-image {

      position: absolute;

      inset: 0;

      width: 100%;

      height: 100%;

      display: block;

      object-fit: fill;
    }


    /* =================================
       INVISIBLE PASSWORD INPUT
       
       The artwork already contains:
       🔒 password box
       "Enter password..."
       👁 eye
       
       We are NOT creating another box.
       ================================= */

    .password-input {

      position: absolute;

      left: 29%;

      top: 60.1%;

      width: 57%;

      height: 7%;

      border: none;

      outline: none;

      background: transparent;

      padding: 0 5px;

      font-size: 17px;

      font-family: Arial, sans-serif;

      color: #477cc7;

      z-index: 20;

      cursor: text;

      -webkit-appearance: none;

      appearance: none;
    }


    /*
      IMPORTANT:
      No placeholder here.

      The words "Enter password..."
      come from your artwork itself.
    */


    /* =================================
       INVISIBLE EYE BUTTON
       ================================= */

    .eye-button {

      position: absolute;

      right: 16%;

      top: 62.7%;

      width: 10%;

      height: 7%;

      border: none;

      outline: none;

      background: transparent;

      cursor: pointer;

      padding: 0;

      z-index: 30;
    }


    /* =================================
       INVISIBLE UNLOCK BUTTON
       ================================= */

    .unlock-button {

      position: absolute;

      left: 25%;

      top: 72.5%;

      width: 50%;

      height: 8.5%;

      border: none;

      outline: none;

      background: transparent;

      cursor: pointer;

      padding: 0;

      z-index: 30;
    }


    .unlock-button:active {

      transform: scale(0.96);
    }


    /* =================================
       MAGIC OVERLAY
       ================================= */

    .magic {

      position: absolute;

      inset: 0;

      pointer-events: none;

      opacity: 0;

      z-index: 100;
    }


    /* =================================
       DOOR GLOW
       ================================= */

    .glow {

      position: absolute;

      left: 50%;

      top: 19%;

      width: 48%;

      aspect-ratio: 1;

      transform:
        translate(-50%, -50%)
        scale(0);

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(255, 250, 200, 0.95) 0%,
          rgba(255, 231, 130, 0.60) 30%,
          rgba(255, 255, 255, 0) 72%
        );

      filter: blur(8px);
    }


    /* =================================
       STARS
       ================================= */

    .star {

      position: absolute;

      color: white;

      font-size: 20px;

      opacity: 0;

      text-shadow:
        0 0 8px white,
        0 0 16px #ffe98a;
    }


    .star1 {
      left: 24%;
      top: 24%;
    }


    .star2 {
      left: 70%;
      top: 23%;
    }


    .star3 {
      left: 28%;
      top: 33%;
    }


    .star4 {
      left: 72%;
      top: 34%;
    }


    .star5 {
      left: 50%;
      top: 17%;
    }


    /* =================================
       MAGIC KEY
       ================================= */

    .key {

      position: absolute;

      left: 50%;

      top: 38%;

      font-size: 50px;

      opacity: 0;

      transform:
        translate(-50%, -50%)
        rotate(-25deg)
        scale(0.5);

      filter:
        drop-shadow(
          0 0 8px rgba(255, 232, 120, 0.9)
        );

      z-index: 110;
    }


    /* =================================
       WHITE FLASH
       ================================= */

    .flash {

      position: absolute;

      inset: 0;

      background: white;

      opacity: 0;

      z-index: 120;
    }


    /* =================================
       START MAGIC
       ================================= */

    .magic.active {

      opacity: 1;
    }


    .magic.active .glow {

      animation:
        glowIn
        1.2s
        ease
        forwards;
    }


    .magic.active .key {

      animation:
        keyMove
        2.4s
        ease-in-out
        forwards;
    }


    .magic.active .star {

      animation:
        starBurst
        2.5s
        ease-out
        forwards;
    }


    .magic.active .star1 {
      animation-delay: 1.5s;
    }


    .magic.active .star2 {
      animation-delay: 1.7s;
    }


    .magic.active .star3 {
      animation-delay: 1.4s;
    }


    .magic.active .star4 {
      animation-delay: 1.8s;
    }


    .magic.active .star5 {
      animation-delay: 1.6s;
    }


    .magic.active .flash {

      animation:
        flashScreen
        0.7s
        ease-in
        2.8s
        forwards;
    }


    /* =================================
       GLOW ANIMATION
       ================================= */

    @keyframes glowIn {

      0% {

        transform:
          translate(-50%, -50%)
          scale(0);

        opacity: 0;
      }


      60% {

        transform:
          translate(-50%, -50%)
          scale(1.4);

        opacity: 1;
      }


      100% {

        transform:
          translate(-50%, -50%)
          scale(1.1);

        opacity: 0.9;
      }
    }


    /* =================================
       KEY ANIMATION
       ================================= */

    @keyframes keyMove {

      /* Key appears */

      0% {

        left: 50%;

        top: 38%;

        opacity: 0;

        transform:
          translate(-50%, -50%)
          rotate(-25deg)
          scale(0.5);
      }


      /* Key becomes visible */

      15% {

        opacity: 1;
      }


      /* Key moves toward door */

      55% {

        left: 50%;

        top: 19%;

        opacity: 1;

        transform:
          translate(-50%, -50%)
          rotate(10deg)
          scale(1);
      }


      /* Key turns */

      68% {

        left: 50%;

        top: 19%;

        transform:
          translate(-50%, -50%)
          rotate(95deg)
          scale(1);
      }


      /* Small return turn */

      78% {

        left: 50%;

        top: 19%;

        transform:
          translate(-50%, -50%)
          rotate(65deg)
          scale(1.05);
      }


      /* Key disappears */

      100% {

        left: 50%;

        top: 19%;

        opacity: 0;

        transform:
          translate(-50%, -50%)
          rotate(65deg)
          scale(0.7);
      }
    }


    /* =================================
       STAR ANIMATION
       ================================= */

    @keyframes starBurst {

      0% {

        opacity: 0;

        transform: scale(0.3);
      }


      30% {

        opacity: 1;

        transform: scale(1.2);
      }


      100% {

        opacity: 0;

        transform:
          translateY(-45px)
          scale(1.8);
      }
    }


    /* =================================
       FLASH ANIMATION
       ================================= */

    @keyframes flashScreen {

      0% {
        opacity: 0;
      }


      50% {
        opacity: 0.9;
      }


      100% {
        opacity: 0;
      }
    }


    /* =================================
       DESKTOP
       ================================= */

    @media (min-width: 600px) {

      body {

        padding: 25px 0;
      }


      .page {

        border-radius: 20px;

        box-shadow:
          0 10px 40px
          rgba(40, 90, 150, 0.25);
      }
    }


    /* =================================
       MOBILE
       ================================= */

    @media (max-width: 599px) {

      body {

        background: #eef8ff;

        padding: 0;
      }


      .page {

        width: 100%;

        max-width: 430px;

        border-radius: 0;

        box-shadow: none;
      }
    }

  </style>

</head>


<body>


  <div class="page">


    <!-- ORIGINAL ARTWORK -->

    <img
      class="page-image"
      src="password-door.png"
      alt="A little secret"
    >


    <!-- INVISIBLE PASSWORD INPUT -->

    <input
      id="password"
      class="password-input"
      type="password"
      autocomplete="off"
      aria-label="Enter password"
    >


    <!-- INVISIBLE EYE BUTTON -->

    <button
      class="eye-button"
      onclick="togglePassword()"
      type="button"
      aria-label="Show password"
    ></button>


    <!-- INVISIBLE UNLOCK BUTTON -->

    <button
      class="unlock-button"
      onclick="checkPassword()"
      type="button"
      aria-label="Unlock"
    ></button>


    <!-- MAGIC -->

    <div
      id="magic"
      class="magic"
    >

      <div class="glow"></div>


      <div class="key">
        🔑
      </div>


      <div class="star star1">
        ✦
      </div>


      <div class="star star2">
        ✧
      </div>


      <div class="star star3">
        ✦
      </div>


      <div class="star star4">
        ✧
      </div>


      <div class="star star5">
        ✦
      </div>


      <div class="flash"></div>

    </div>


  </div>


  <script>


    /* =================================
       PASSWORD CHECK
       ================================= */

    function checkPassword() {

      const enteredPassword =
        document.getElementById("password").value;


      /*
       * =================================
       * CHANGE ONLY THIS
       *
       * PUT YOUR EXISTING PASSWORD HERE.
       *
       * DO NOT SEND IT TO ME.
       * =================================
       */

      const correctPassword =
        "bandri";


      if (
        enteredPassword === correctPassword
      ) {


        /* Hide password */

        document
          .getElementById("password")
          .style.display = "none";


        /* Hide eye */

        document
          .querySelector(".eye-button")
          .style.display = "none";


        /* Hide unlock */

        document
          .querySelector(".unlock-button")
          .style.display = "none";


        /* Start magic */

        document
          .getElementById("magic")
          .classList
          .add("active");


        /* Open Access Granted page */

        setTimeout(
          function() {

            window.location.href =
              "birthday.html";

          },
          3500
        );

      }


      else {

        alert(
          "Hmm... that's not quite it 💙"
        );

      }

    }


    /* =================================
       SHOW / HIDE PASSWORD
       ================================= */

    function togglePassword() {

      const password =
        document.getElementById("password");


      if (
        password.type === "password"
      ) {

        password.type = "text";

      }

      else {

        password.type = "password";

      }

    }


    /* =================================
       ENTER KEY
       ================================= */

    document
      .getElementById("password")
      .addEventListener(
        "keydown",
        function(event) {

          if (
            event.key === "Enter"
          ) {

            checkPassword();

          }

        }
      );

  </script>


</body>

</html>
