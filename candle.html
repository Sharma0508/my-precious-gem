<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Make a Wish 💙</title>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;

      padding: 0;

      width: 100%;

      min-height: 100%;
    }


    body {

      background: #dceeff;

      display: flex;

      justify-content: center;

      align-items: flex-start;

      font-family: Arial, sans-serif;

      overflow-x: hidden;
    }


    /* =================================
       PHONE PAGE
       ================================= */

    .phone-page {

      position: relative;

      width: 100%;

      max-width: 430px;

      margin: 0 auto;

      background: #eef8ff;

      overflow: hidden;
    }


    /* =================================
       CANDLE ARTWORK
       ================================= */

    .page-image {

      display: block;

      width: 100%;

      height: auto;

      margin: 0;

      padding: 0;
    }


    /* =================================
       INVISIBLE CANDLE BUTTON
       
       This sits over the candle
       in the artwork.
       ================================= */

    .candle-button {

      position: absolute;

      left: 44%;

      top: 32%;

      width: 13%;

      height: 16%;

      border: none;

      background: transparent;

      cursor: pointer;

      padding: 0;

      z-index: 20;
    }


    /* =================================
       CANDLE GLOW
       ================================= */

    .candle-glow {

      position: absolute;

      left: 50%;

      top: 39%;

      width: 25%;

      aspect-ratio: 1;

      transform:
        translate(-50%, -50%)
        scale(0);

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(255, 239, 150, 0.95) 0%,
          rgba(255, 220, 100, 0.45) 35%,
          rgba(255, 255, 255, 0) 72%
        );

      filter: blur(8px);

      opacity: 0;

      pointer-events: none;

      z-index: 15;
    }


    /* =================================
       MAGIC SPARKLES
       ================================= */

    .sparkle {

      position: absolute;

      color: white;

      font-size: 24px;

      opacity: 0;

      pointer-events: none;

      text-shadow:
        0 0 8px white,
        0 0 18px #ffe88a;

      z-index: 25;
    }


    .sparkle1 {
      left: 32%;
      top: 34%;
    }


    .sparkle2 {
      left: 65%;
      top: 35%;
    }


    .sparkle3 {
      left: 38%;
      top: 48%;
    }


    .sparkle4 {
      left: 61%;
      top: 47%;
    }


    /* =================================
       WISH MESSAGE AFTER TAP
       ================================= */

    .wish-message {

      position: absolute;

      left: 50%;

      top: 42%;

      transform:
        translate(-50%, -50%)
        scale(0.8);

      width: 85%;

      text-align: center;

      color: white;

      font-size: 25px;

      font-weight: bold;

      line-height: 1.35;

      text-shadow:
        0 2px 10px rgba(40, 80, 150, 0.7),
        0 0 15px rgba(255,255,255,0.8);

      opacity: 0;

      pointer-events: none;

      z-index: 30;
    }


    /* =================================
       MAGIC ACTIVE
       ================================= */

    .magic {

      opacity: 0;

      pointer-events: none;
    }


    .magic.active {

      opacity: 1;
    }


    .magic.active .candle-glow {

      animation:
        glowAppear
        1s
        ease-out
        forwards;
    }


    .magic.active .sparkle {

      animation:
        sparkleBurst
        1.5s
        ease-out
        forwards;
    }


    .magic.active .sparkle2 {

      animation-delay: 0.15s;
    }


    .magic.active .sparkle3 {

      animation-delay: 0.3s;
    }


    .magic.active .sparkle4 {

      animation-delay: 0.45s;
    }


    .magic.active .wish-message {

      animation:
        wishAppear
        1.2s
        ease-out
        0.4s
        forwards;
    }


    /* =================================
       GLOW ANIMATION
       ================================= */

    @keyframes glowAppear {

      0% {

        opacity: 0;

        transform:
          translate(-50%, -50%)
          scale(0);
      }


      50% {

        opacity: 1;

        transform:
          translate(-50%, -50%)
          scale(1.4);
      }


      100% {

        opacity: 0.7;

        transform:
          translate(-50%, -50%)
          scale(1);
      }

    }


    /* =================================
       SPARKLE ANIMATION
       ================================= */

    @keyframes sparkleBurst {

      0% {

        opacity: 0;

        transform: scale(0.2);
      }


      35% {

        opacity: 1;

        transform: scale(1.3);
      }


      100% {

        opacity: 0;

        transform:
          translateY(-45px)
          scale(1.8);
      }

    }


    /* =================================
       WISH MESSAGE ANIMATION
       ================================= */

    @keyframes wishAppear {

      0% {

        opacity: 0;

        transform:
          translate(-50%, -50%)
          scale(0.8);
      }


      100% {

        opacity: 1;

        transform:
          translate(-50%, -50%)
          scale(1);
      }

    }


    /* =================================
       DESKTOP
       ================================= */

    @media (min-width: 600px) {

      body {

        padding: 25px 0;
      }


      .phone-page {

        border-radius: 20px;

        box-shadow:
          0 10px 40px
          rgba(40, 90, 150, 0.25);
      }

    }


    /* =================================
       MOBILE
       ================================= */

    @media (max-width: 599px) {

      body {

        background: #eef8ff;

        padding: 0;
      }


      .phone-page {

        width: 100%;

        max-width: 430px;

        border-radius: 0;

        box-shadow: none;
      }

    }

  </style>

</head>


<body>


  <div class="phone-page">


    <!-- CANDLE ARTWORK -->

    <img
      class="page-image"
      src="candle.png"
      alt="Make a wish"
    >


    <!-- MAGIC EFFECT -->

    <div
      id="magic"
      class="magic"
    >

      <div class="candle-glow"></div>


      <div class="sparkle sparkle1">
        ✦
      </div>


      <div class="sparkle sparkle2">
        ✧
      </div>


      <div class="sparkle sparkle3">
        ✦
      </div>


      <div class="sparkle sparkle4">
        ✧
      </div>


      <div class="wish-message">

        ✨ Wish made... ✨

      </div>

    </div>


    <!-- INVISIBLE CANDLE BUTTON -->

    <button
      class="candle-button"
      onclick="blowCandle()"
      type="button"
      aria-label="Blow out the candle">
    </button>


  </div>


  <script>


    function blowCandle() {


      /*
       * Start the magical wish effect.
       */

      document
        .getElementById("magic")
        .classList
        .add("active");


      /*
       * Prevent the candle from
       * being tapped repeatedly.
       */

      document
        .querySelector(".candle-button")
        .style.pointerEvents = "none";


      /*
       * After the wish animation,
       * open the next page.
       *
       * We will create wish.html
       * next.
       */

      setTimeout(
        function() {

          window.location.href =
            "wish.html";

        },
        2200
      );

    }

  </script>


</body>

</html>
