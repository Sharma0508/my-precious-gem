<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For You 🌷</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600&family=Pacifico&display=swap" rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            overflow: hidden;

            background:
                radial-gradient(
                    circle at 50% 35%,
                    #fffdf8 0%,
                    #fff7f5 42%,
                    #fbeceb 75%,
                    #f7e3e1 100%
                );

            position: relative;
            font-family: "Baloo 2", sans-serif;
        }


        /* -------------------------
           DREAMY BACKGROUND
        -------------------------- */

        .glow {
            position: absolute;

            width: 420px;
            height: 420px;

            left: 50%;
            top: 38%;

            transform: translate(-50%, -50%);

            border-radius: 50%;

            background: rgba(255, 180, 180, 0.22);

            filter: blur(65px);

            pointer-events: none;
        }


        /* little clouds */

        .cloud {
            position: absolute;

            width: 130px;
            height: 42px;

            background: rgba(255,255,255,0.68);

            border-radius: 50px;

            filter: blur(1px);

            opacity: 0.8;
        }

        .cloud::before,
        .cloud::after {
            content: "";

            position: absolute;

            background: rgba(255,255,255,0.75);

            border-radius: 50%;
        }

        .cloud::before {
            width: 55px;
            height: 55px;

            left: 20px;
            bottom: 13px;
        }

        .cloud::after {
            width: 65px;
            height: 65px;

            right: 18px;
            bottom: 7px;
        }

        .cloud-one {
            top: 13%;
            left: -40px;
        }

        .cloud-two {
            top: 25%;
            right: -50px;

            transform: scale(.75);
        }


        /* -------------------------
           FLOATING PETALS
        -------------------------- */

        .petal {
            position: absolute;

            width: 12px;
            height: 18px;

            background: #c8323d;

            border-radius: 100% 0 100% 0;

            opacity: .65;

            animation: falling linear infinite;

            z-index: 2;
        }

        .petal:nth-child(1) {
            left: 8%;
            animation-duration: 8s;
            animation-delay: -2s;
        }

        .petal:nth-child(2) {
            left: 23%;
            animation-duration: 10s;
            animation-delay: -6s;
            transform: scale(.7);
        }

        .petal:nth-child(3) {
            left: 73%;
            animation-duration: 9s;
            animation-delay: -4s;
            transform: scale(.8);
        }

        .petal:nth-child(4) {
            left: 88%;
            animation-duration: 11s;
            animation-delay: -8s;
            transform: scale(.6);
        }

        .petal:nth-child(5) {
            left: 48%;
            animation-duration: 12s;
            animation-delay: -10s;
            transform: scale(.55);
        }

        @keyframes falling {

            0% {
                top: -30px;
                transform: rotate(0deg) translateX(0);
            }

            50% {
                transform: rotate(180deg) translateX(28px);
            }

            100% {
                top: 110vh;
                transform: rotate(360deg) translateX(-25px);
            }

        }


        /* -------------------------
           SPARKLES
        -------------------------- */

        .sparkle {
            position: absolute;

            color: #c96b72;

            font-size: 19px;

            animation: twinkle 2.5s ease-in-out infinite;

            z-index: 3;
        }

        .sparkle-one {
            top: 17%;
            left: 18%;
        }

        .sparkle-two {
            top: 24%;
            right: 19%;

            animation-delay: .7s;
        }

        .sparkle-three {
            bottom: 28%;
            left: 12%;

            animation-delay: 1.1s;
        }

        .sparkle-four {
            bottom: 22%;
            right: 13%;

            animation-delay: .4s;
        }

        @keyframes twinkle {

            0%,
            100% {
                opacity: .25;
                transform: scale(.7) rotate(0deg);
            }

            50% {
                opacity: 1;
                transform: scale(1.15) rotate(15deg);
            }

        }


        /* -------------------------
           MAIN CONTENT
        -------------------------- */

        .page {
            position: relative;

            z-index: 5;

            min-height: 100vh;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            padding: 20px;
        }


        /* -------------------------
           BOUQUET
        -------------------------- */

        .bouquet {
            width: min(88vw, 500px);

            animation:
                floating 4s ease-in-out infinite,
                appear 1.2s ease forwards;

            filter:
                drop-shadow(
                    0 18px 28px
                    rgba(120, 35, 35, .17)
                );
        }

        .bouquet img {
            display: block;

            width: 100%;

            height: auto;

            object-fit: contain;
        }

        @keyframes floating {

            0%,
            100% {
                transform: translateY(0) rotate(-1deg);
            }

            50% {
                transform: translateY(-9px) rotate(1deg);
            }

        }

        @keyframes appear {

            from {
                opacity: 0;
                transform: translateY(30px) scale(.94);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }

        }


        /* -------------------------
           MESSAGE
        -------------------------- */

        .message {
            margin-top: 5px;

            text-align: center;

            opacity: 0;

            animation:
                messageAppear 1.2s ease .8s forwards;
        }

        .message h1 {
            font-family: "Pacifico", cursive;

            font-size: clamp(
                28px,
                7vw,
                43px
            );

            font-weight: 400;

            color: #7d3037;

            line-height: 1.25;

            text-shadow:
                0 2px 8px
                rgba(125,48,55,.08);
        }

        .heart {
            margin-top: 9px;

            color: #b93843;

            font-size: 21px;

            animation: heartbeat 2s ease-in-out infinite;
        }

        @keyframes messageAppear {

            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        @keyframes heartbeat {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.18);
            }

        }


        /* -------------------------
           MOBILE
        -------------------------- */

        @media (max-width: 600px) {

            .page {
                padding: 15px;
            }

            .bouquet {
                width: 94vw;
                max-width: 420px;
            }

            .message {
                margin-top: 0;
            }

            .message h1 {
                font-size: 30px;
            }

            .heart {
                font-size: 19px;
            }

            .cloud {
                opacity: .45;
            }

        }

    </style>
</head>


<body>


    <!-- DREAMY LIGHT -->

    <div class="glow"></div>


    <!-- CLOUDS -->

    <div class="cloud cloud-one"></div>
    <div class="cloud cloud-two"></div>


    <!-- FLOATING PETALS -->

    <div class="petal"></div>
    <div class="petal"></div>
    <div class="petal"></div>
    <div class="petal"></div>
    <div class="petal"></div>


    <!-- SPARKLES -->

    <div class="sparkle sparkle-one">✦</div>
    <div class="sparkle sparkle-two">✧</div>
    <div class="sparkle sparkle-three">✦</div>
    <div class="sparkle sparkle-four">✧</div>


    <!-- PAGE -->

    <main class="page">


        <!-- BOUQUET -->

        <div class="bouquet">

            <!--
                IMPORTANT:

                Put your bouquet image in the same
                GitHub folder as this HTML file.

                Rename it to:

                bouquet.png
            -->

            <img
                src="bouquet.png"
                alt="A bouquet of flowers"
            >

        </div>


        <!-- MESSAGE -->

        <div class="message">

            <h1>
                Flowers for the sweetest soul. 🌷
            </h1>

            <div class="heart">
                ♡
            </div>

        </div>


    </main>


</body>
</html>
