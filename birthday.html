<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Access Granted 🐧💙</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: "Trebuchet MS", Arial, sans-serif;

    background:
        radial-gradient(circle at 20% 15%, rgba(255,255,255,0.8), transparent 18%),
        radial-gradient(circle at 85% 20%, rgba(255,255,255,0.7), transparent 18%),
        linear-gradient(180deg, #82bdf5 0%, #b9dcff 48%, #e5f3ff 100%);

    display: flex;
    justify-content: center;
    align-items: center;

    overflow-x: hidden;
    overflow-y: auto;

    color: #24549b;
}


/* =========================
   FLOATING STARS
========================= */

.star {
    position: fixed;
    z-index: 1;
    font-size: 25px;
    animation: float 4s ease-in-out infinite;
}

.star1 {
    top: 7%;
    left: 7%;
}

.star2 {
    top: 12%;
    right: 8%;
    animation-delay: 1s;
}

.star3 {
    bottom: 14%;
    left: 8%;
    animation-delay: 2s;
}

.star4 {
    bottom: 10%;
    right: 8%;
    animation-delay: 1.5s;
}

@keyframes float {

    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-10px);
    }
}


/* =========================
   LITTLE CLOUDS
========================= */

.cloud {
    position: fixed;
    background: rgba(255,255,255,0.75);
    border-radius: 50px;
    z-index: 0;
}

.cloud1 {
    width: 150px;
    height: 45px;
    top: 12%;
    left: -35px;
}

.cloud2 {
    width: 180px;
    height: 55px;
    top: 25%;
    right: -50px;
}


/* =========================
   MAIN CARD
========================= */

.card {
    width: 90%;
    max-width: 440px;

    margin: 30px auto;

    background: rgba(255,255,255,0.92);

    border-radius: 38px;

    padding: 20px 24px 28px;

    text-align: center;

    box-shadow:
        0 20px 50px rgba(40,90,150,0.28);

    border: 4px solid rgba(255,255,255,0.95);

    position: relative;

    z-index: 5;

    animation: appear 1s ease;
}

@keyframes appear {

    from {
        opacity: 0;
        transform: translateY(25px) scale(0.96);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}


/* =========================
   PINGU AREA
========================= */

.pingu-area {
    height: 245px;

    display: flex;
    justify-content: center;
    align-items: center;

    position: relative;
}


/* =========================
   PENGUIN
========================= */

.pingu {
    width: 190px;
    height: 210px;

    position: relative;

    margin-top: 20px;

    animation: pinguFloat 3s ease-in-out infinite;
}

@keyframes pinguFloat {

    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-7px);
    }
}


/* HEAD + BODY */

.pingu-body {
    position: absolute;

    width: 155px;
    height: 175px;

    left: 18px;
    top: 25px;

    background: #26344d;

    border-radius: 48% 48% 45% 45%;

    box-shadow:
        inset -8px -10px 0 rgba(0,0,0,0.08);
}


/* WHITE BELLY */

.belly {
    position: absolute;

    width: 112px;
    height: 125px;

    left: 40px;
    top: 72px;

    background: #f9fcff;

    border-radius: 50%;
}


/* FACE */

.face {
    position: absolute;

    width: 125px;
    height: 110px;

    left: 33px;
    top: 42px;

    background: #f8fbff;

    border-radius: 50%;
}


/* EYES */

.eye {
    position: absolute;

    width: 13px;
    height: 17px;

    background: #182337;

    border-radius: 50%;

    top: 48px;

    z-index: 3;
}

.eye.left {
    left: 37px;
}

.eye.right {
    right: 37px;
}


/* CLOSED EYE LINES */

.eye-shine {
    position: absolute;

    width: 5px;
    height: 5px;

    background: white;

    border-radius: 50%;

    top: 3px;
    left: 3px;
}


/* CHEEKS */

.cheek {
    position: absolute;

    width: 27px;
    height: 15px;

    background: #ffb1bd;

    border-radius: 50%;

    top: 68px;

    opacity: 0.8;
}

.cheek.left {
    left: 10px;
}

.cheek.right {
    right: 10px;
}


/* BEAK */

.beak {
    position: absolute;

    width: 27px;
    height: 19px;

    background: #f4a340;

    left: 49px;
    top: 62px;

    border-radius: 60% 40% 60% 40%;

    transform: rotate(2deg);

    z-index: 5;
}


/* LITTLE SMILE */

.smile {
    position: absolute;

    width: 15px;
    height: 7px;

    border-bottom: 2px solid #d47b22;

    border-radius: 50%;

    left: 55px;
    top: 79px;

    z-index: 5;
}


/* WINGS */

.wing {
    position: absolute;

    width: 52px;
    height: 95px;

    background: #202e46;

    border-radius: 50%;

    top: 82px;

    z-index: 1;
}

.wing.left {
    left: 0;

    transform: rotate(20deg);
}

.wing.right {
    right: 0;

    transform: rotate(-20deg);
}


/* FEET */

.foot {
    position: absolute;

    width: 48px;
    height: 27px;

    background: #f3a13b;

    border-radius: 50%;

    bottom: 5px;

    z-index: 6;
}

.foot.left {
    left: 28px;
}

.foot.right {
    right: 28px;
}


/* =========================
   BLUE WINTER HAT
========================= */

.hat {
    position: absolute;

    width: 130px;
    height: 50px;

    background: #5d9eea;

    border-radius: 70px 70px 20px 20px;

    left: 30px;
    top: 4px;

    z-index: 10;

    box-shadow:
        inset 0 -8px 0 rgba(40,100,180,0.18);
}


/* HAT STRIPES */

.hat::after {
    content: "";

    position: absolute;

    width: 100%;
    height: 12px;

    bottom: 0;
    left: 0;

    background: #78b5f5;

    border-radius: 10px;
}


/* POM POM */

.pom {
    position: absolute;

    width: 38px;
    height: 38px;

    background: #eef7ff;

    border-radius: 50%;

    left: 46px;
    top: -22px;

    z-index: 11;

    box-shadow:
        0 0 0 5px rgba(255,255,255,0.35);
}


/* =========================
   HEART
========================= */

.heart {
    position: absolute;

    width: 67px;
    height: 67px;

    background: #62a5f3;

    left: 61px;
    top: 125px;

    transform: rotate(-45deg);

    border-radius: 12px;

    z-index: 8;

    box-shadow:
        0 7px 15px rgba(50,100,180,0.25);
}

.heart::before,
.heart::after {
    content: "";

    position: absolute;

    width: 67px;
    height: 67px;

    background: #62a5f3;

    border-radius: 50%;
}

.heart::before {
    top: -33px;
    left: 0;
}

.heart::after {
    top: 0;
    left: 33px;
}


/* =========================
   TITLE
========================= */

h1 {
    margin: 0;

    font-size: 36px;

    line-height: 1.15;

    color: #285aa3;
}

.divider {
    margin: 8px 0 18px;

    font-size: 25px;

    color: #5596e6;
}


/* =========================
   MESSAGE
========================= */

.message {
    font-size: 18px;

    line-height: 1.65;

    color: #31598f;

    margin-bottom: 22px;
}

.message strong {
    display: inline-block;

    font-size: 22px;

    color: #24559e;

    background: #dcecff;

    padding: 5px 15px;

    border-radius: 16px;

    margin-top: 5px;
}


/* =========================
   BUTTON
========================= */

button {
    border: none;

    background: linear-gradient(
        135deg,
        #75b4f8,
        #397ed5
    );

    color: white;

    font-size: 20px;

    font-family: inherit;

    font-weight: bold;

    padding: 15px 55px;

    border-radius: 30px;

    cursor: pointer;

    box-shadow:
        0 8px 20px rgba(50,110,190,0.32);

    transition: 0.2s;
}

button:hover {
    transform: translateY(-2px);
}

button:active {
    transform: scale(0.96);
}


/* =========================
   BOTTOM TEXT
========================= */

.bottom-text {
    margin-top: 18px;

    font-size: 15px;

    color: #557baa;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 480px) {

    body {
        align-items: flex-start;
    }

    .card {
        width: 92%;

        margin: 25px auto;

        padding: 16px 16px 25px;

        border-radius: 32px;
    }

    .pingu-area {
        height: 225px;
    }

    .pingu {
        transform: scale(0.92);
    }

    h1 {
        font-size: 31px;
    }

    .message {
        font-size: 16px;
    }

    .message strong {
        font-size: 19px;
    }

    button {
        font-size: 18px;

        padding: 14px 45px;
    }

    .star {
        font-size: 20px;
    }
}

</style>
</head>


<body>


<!-- BACKGROUND DECORATIONS -->

<div class="star star1">⭐</div>
<div class="star star2">✨</div>
<div class="star star3">💙</div>
<div class="star star4">⭐</div>

<div class="cloud cloud1"></div>
<div class="cloud cloud2"></div>


<!-- =========================
     MAIN CARD
========================= -->

<div class="card">


    <!-- PINGU -->

    <div class="pingu-area">

        <div class="pingu">

            <!-- hat -->

            <div class="hat">
                <div class="pom"></div>
            </div>


            <!-- body -->

            <div class="pingu-body"></div>

            <div class="belly"></div>


            <!-- face -->

            <div class="face">

                <div class="eye left">
                    <div class="eye-shine"></div>
                </div>

                <div class="eye right">
                    <div class="eye-shine"></div>
                </div>

                <div class="cheek left"></div>
                <div class="cheek right"></div>

                <div class="beak"></div>

                <div class="smile"></div>

            </div>


            <!-- wings -->

            <div class="wing left"></div>
            <div class="wing right"></div>


            <!-- heart -->

            <div class="heart"></div>


            <!-- feet -->

            <div class="foot left"></div>
            <div class="foot right"></div>

        </div>

    </div>


    <!-- TITLE -->

    <h1>
        Access Granted! 💙
    </h1>


    <div class="divider">
        ─── ♡ ───
    </div>


    <!-- MESSAGE -->

    <div class="message">

        Pingu checked the secret word... 🐧

        <br>

        And yes...

        <br>

        <strong>
            you are allowed in. 💙
        </strong>

    </div>


    <!-- BUTTON -->

    <button onclick="continueToNext()">
        Continue 🐾
    </button>


    <!-- BOTTOM -->

    <div class="bottom-text">
        🐧 💙 Little surprises are waiting... 💙 🐧
    </div>

</div>


<script>

function continueToNext() {

    alert("The next surprise is waiting for you! 🐧💙");

}

</script>


</body>
</html>
