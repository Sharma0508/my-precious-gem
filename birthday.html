<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Access Granted 💙</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {

            background: #dceeff;

            display: flex;
            justify-content: center;
            align-items: flex-start;

            font-family: Arial, sans-serif;
        }


        /* 
        =====================================
        PHONE-SIZED PAGE
        =====================================
        */

        .phone-page {

            position: relative;

            width: 100%;

            /*
            Maximum width for phone screens.
            */

            max-width: 430px;

            min-height: 100vh;

            margin: 0 auto;

            background: #eef8ff;

            overflow: hidden;
        }


        /* 
        =====================================
        EXACT IMAGE
        =====================================
        */

        .page-image {

            display: block;

            width: 100%;

            height: auto;

            margin: 0;

            padding: 0;
        }


        /*
        =====================================
        CONTINUE BUTTON
        =====================================

        This is an invisible button placed
        exactly over the Continue button
        inside the picture.
        */

        .continue-button {

            position: absolute;

            /*
            Position based on the original
            1024 x 1536 image.
            */

            left: 29.8%;

            top: 69%;

            width: 40.5%;

            height: 8.5%;

            border: none;

            background: transparent;

            cursor: pointer;

            padding: 0;

            z-index: 10;
        }


        .continue-button:active {

            transform: scale(0.96);
        }


        /*
        =====================================
        COMPUTER PREVIEW
        =====================================

        When you open it on your computer,
        you'll see it centered like a phone.
        */

        @media (min-width: 600px) {

            body {

                padding: 25px 0;
            }

            .phone-page {

                border-radius: 20px;

                box-shadow:
                    0 10px 40px rgba(40, 90, 150, 0.25);
            }

        }


        /*
        =====================================
        REAL PHONE
        =====================================
        */

        @media (max-width: 599px) {

            body {

                background: #eef8ff;

                padding: 0;
            }

            .phone-page {

                width: 100%;

                max-width: 430px;

                border-radius: 0;

                box-shadow: none;
            }

        }

    </style>

</head>


<body>


    <div class="phone-page">


        <!-- EXACT ACCESS GRANTED IMAGE -->

        <img
            class="page-image"
            src="access-granted.png.png"
            alt="Access Granted"
        >


        <!-- INVISIBLE CONTINUE BUTTON -->

        <button
            class="continue-button"
            onclick="continueToNext()"
            aria-label="Continue">
        </button>


    </div>


    <script>

        function continueToNext() {

            window.location.href = "bouquet.html";

        }

    </script>


</body>

</html>
