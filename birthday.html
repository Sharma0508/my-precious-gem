<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Access Granted 💙</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #eef8ff;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .page {
            position: relative;
            width: 100%;
            max-width: 1024px;
            line-height: 0;
        }

        .page img {
            width: 100%;
            height: auto;
            display: block;
        }

        /*
        ==========================================
        INVISIBLE CONTINUE BUTTON
        ==========================================

        The actual button is already drawn inside
        the picture.

        This transparent area sits exactly over it
        and makes it clickable.
        */

        .continue-button {
            position: absolute;

            left: 29.8%;
            width: 40.5%;

            top: 71.8%;
            height: 8.5%;

            background: transparent;

            border: none;

            cursor: pointer;

            padding: 0;

            z-index: 10;
        }

        .continue-button:focus {
            outline: none;
        }

        /*
        Slight click animation
        */

        .continue-button:active {
            transform: scale(0.97);
        }


        /*
        ==========================================
        MOBILE
        ==========================================
        */

        @media (max-width: 600px) {

            .page {
                width: 100%;
            }

            .continue-button {
                left: 29.8%;
                width: 40.5%;

                top: 71.8%;
                height: 8.5%;
            }

        }

    </style>

</head>


<body>


    <div class="page">

        <!-- YOUR EXACT ACCESS GRANTED IMAGE -->

        <img
            src="access-granted.png"
            alt="Access Granted"
        >


        <!-- INVISIBLE CLICKABLE AREA -->

        <button
            class="continue-button"
            onclick="continueToNext()"
            aria-label="Continue">
        </button>

    </div>


    <script>

        function continueToNext() {

            alert("The next surprise is waiting... 💙🐒");

        }

    </script>


</body>

</html>
