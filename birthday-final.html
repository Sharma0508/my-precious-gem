<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday Devansh ❤️</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
    }

    body {
        background: #eef8ff;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        overflow-x: hidden;
    }

    .phone-page {
        width: 100%;
        max-width: 430px;
        min-height: 100vh;
        background: #eef8ff;
        overflow: hidden;
    }

    .page-image {
        width: 100%;
        height: auto;
        display: block;
    }

    @media (max-width: 599px) {
        .phone-page {
            width: 100%;
            max-width: 430px;
        }
    }
</style>
</head>

<body>

<div class="phone-page">

    <img
        src="birthday-final.png"
        class="page-image"
        alt="Happy Birthday Devansh - October 08"
    >

</div>

</body>
</html>
